# GitHub Actions: сбор судов по расписанию.
# Положите этот файл в репозиторий по пути .github/workflows/ships.yml
name: Суда в зоне

on:
  schedule:
    - cron: "37 5 * * *"     # раз в сутки, 05:37 UTC (07:37 по Калининграду)
  workflow_dispatch:          # кнопка ручного запуска во вкладке Actions
    inputs:
      source:
        description: "Источник: gfw (Global Fishing Watch), mst (MyShipTracking), aisstream"
        required: false
        default: "gfw"
      days:
        description: "GFW: за сколько дней загрузить заходы (для первой загрузки истории можно 90)"
        required: false
        default: "14"
      area:
        description: "Проверочная область (пусто = Калининград). Формат: шир1,долг1,шир2,долг2"
        required: false
        default: ""

permissions:
  contents: write             # чтобы сохранять обновлённые таблицы в репозиторий

concurrency:
  group: ships
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install websockets
      - name: Сбор данных
        env:
          SOURCE: ${{ inputs.source || 'gfw' }}
          GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
          GFW_LOOKBACK_DAYS: ${{ inputs.days || '14' }}
          MST_API_KEY: ${{ secrets.MST_API_KEY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          INTERVAL_MINUTES: "180"
          AREA: ${{ inputs.area }}
          # проверочные запуски пишут в отдельную папку, чтобы не смешивать с рабочими данными
          DATA_DIR: ${{ inputs.area != '' && 'data_test' || 'data' }}
        run: python ships_in_zone.py
      - name: Сохранить таблицы
        run: |
          git config user.name "ships-bot"
          git config user.email "ships-bot@users.noreply.github.com"
          git add -A
          git commit -m "Данные $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "Нет изменений"
          git push
