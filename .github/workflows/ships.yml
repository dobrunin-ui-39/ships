# GitHub Actions: запуск каждые 30 минут на серверах GitHub (бесплатно для публичного репозитория).
# Положите этот файл в репозиторий по пути .github/workflows/ships.yml
name: Суда в зоне

on:
  schedule:
    - cron: "*/30 * * * *"   # время UTC; GitHub может задерживать запуск на 5-20 минут
  workflow_dispatch:          # кнопка ручного запуска во вкладке Actions
    inputs:
      area:
        description: "Проверочная область (пусто = Калининград). Пример всей Балтики: 53.5,9.5,66,30.5"
        required: false
        default: ""

permissions:
  contents: write             # чтобы сохранять обновлённые таблицы в репозиторий

concurrency:
  group: ships
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install websockets
      - name: Сбор данных
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          AREA: ${{ inputs.area }}
          # проверочные запуски пишут в отдельную папку, чтобы не смешивать с рабочими данными
          DATA_DIR: ${{ inputs.area != '' && 'data_test' || 'data' }}
        run: python ships_in_zone.py
      - name: Сохранить таблицы
        run: |
          git config user.name "ships-bot"
          git config user.email "ships-bot@users.noreply.github.com"
          git add -A
          git commit -m "Данные $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "Нет изменений"
          git push
